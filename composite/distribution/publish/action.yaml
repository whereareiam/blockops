name: Publish distribution
description: Resolve release metadata and publish every selected publication in one job

inputs:
  provider-credentials:
    description: YAML mapping of provider ids to credentials
    required: false
    default: ""
  release-tag:
    description: Release tag to publish, for example 2.0.0-RC6
    required: true
  release-name:
    description: Release name from GitHub
    required: false
    default: ""
  release-body:
    description: Release body from GitHub
    required: false
    default: ""
  release-url:
    description: Release URL from GitHub
    required: false
    default: ""
  manifest-path:
    description: Path to the distribution manifest in the consumer repository
    required: false
    default: .github/release-distribution.yml
  artifact-directory:
    description: Directory containing the build artifacts to publish
    required: true
  targets:
    description: Optional comma-separated publication names to publish
    required: false
    default: ""
  dry-run:
    description: When true, resolve and validate but do not publish
    required: false
    default: "false"
  override-yaml:
    description: Optional YAML merge patch applied to resolved publish data
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install blockops
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet "$GITHUB_ACTION_PATH/../../.."

    - name: Publish distributions
      shell: bash
      env:
        INPUT_PROVIDER_CREDENTIALS: ${{ inputs.provider-credentials }}
        ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        DRY_RUN: ${{ inputs.dry-run }}
        RELEASE_TAG: ${{ inputs.release-tag }}
        RELEASE_NAME: ${{ inputs.release-name }}
        RELEASE_BODY: ${{ inputs.release-body }}
        RELEASE_URL: ${{ inputs.release-url }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        TARGETS: ${{ inputs.targets }}
        OVERRIDE_YAML: ${{ inputs.override-yaml }}
      run: |
        set -euo pipefail
        override_file="$(mktemp)"
        printf '%s' "$OVERRIDE_YAML" > "$override_file"

        blockops-publish-distribution \
          --release-tag "$RELEASE_TAG" \
          --release-name "$RELEASE_NAME" \
          --release-body "$RELEASE_BODY" \
          --release-url "$RELEASE_URL" \
          --manifest-path "$MANIFEST_PATH" \
          --targets "$TARGETS" \
          --override-yaml-file "$override_file" \
          --artifact-directory "$ARTIFACT_DIRECTORY" \
          --dry-run "$DRY_RUN"
