[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blockops-publish"
version = "0.1.0"
description = "Shared release distribution tooling for BlockOps repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.1,<7",
    "requests>=2.32.3,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5,<9",
    "responses>=0.25.7,<0.26",
]

[project.scripts]
blockops-publish-distribution = "blockops_publish.publish.cli_publish_distribution:main"
blockops-resolve-distribution-plan = "blockops_publish.publish.cli_resolve_plan:main"
blockops-publish-publication = "blockops_publish.publish.cli_publish_publication:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
