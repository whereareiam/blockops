name: Publish publication
description: Publish one publication of a resolved distribution plan, for example to Modrinth

inputs:
  provider-credentials:
    description: YAML mapping of provider ids to credentials
    required: false
    default: ""
  plan-json:
    description: Resolved distribution plan as compact JSON
    required: true
  artifact-directory:
    description: Directory containing the build artifacts to publish
    required: true
  publication:
    description: Name of the publication to publish from the plan
    required: true
  dry-run:
    description: When true, resolve and validate but do not publish
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install blockops
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet "$GITHUB_ACTION_PATH/../../../.."

    - name: Publish publication
      shell: bash
      env:
        INPUT_PROVIDER_CREDENTIALS: ${{ inputs.provider-credentials }}
        PLAN_JSON: ${{ inputs.plan-json }}
        ARTIFACT_DIRECTORY: ${{ inputs.artifact-directory }}
        PUBLICATION: ${{ inputs.publication }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        set -euo pipefail
        plan_file="$(mktemp)"
        printf '%s' "$PLAN_JSON" > "$plan_file"

        blockops-publish-publication \
          --plan-file "$plan_file" \
          --artifact-directory "$ARTIFACT_DIRECTORY" \
          --publication "$PUBLICATION" \
          --dry-run "$DRY_RUN"
