name: Resolve distribution plan
description: Resolve release metadata into a publication plan and a job matrix of its publications

inputs:
  release-tag:
    description: Release tag to publish, for example 2.0.0-RC6
    required: true
  release-name:
    description: Release name from GitHub
    required: false
    default: ""
  release-body:
    description: Release body from GitHub
    required: false
    default: ""
  release-url:
    description: Release URL from GitHub
    required: false
    default: ""
  manifest-path:
    description: Path to the distribution manifest in the consumer repository
    required: false
    default: .github/release-distribution.yml
  targets:
    description: Optional comma-separated publication names to include
    required: false
    default: ""
  override-yaml:
    description: Optional YAML merge patch applied to resolved publish data
    required: false
    default: ""

outputs:
  plan-json:
    description: Resolved publish plan as compact JSON
    value: ${{ steps.resolve.outputs.plan-json }}
  matrix-json:
    description: Publication matrix as a compact JSON array
    value: ${{ steps.resolve.outputs.matrix-json }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install blockops
      shell: bash
      run: |
        python -m pip install --quiet --upgrade pip
        python -m pip install --quiet "$GITHUB_ACTION_PATH/../../../.."

    - name: Resolve plan
      id: resolve
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release-tag }}
        RELEASE_NAME: ${{ inputs.release-name }}
        RELEASE_BODY: ${{ inputs.release-body }}
        RELEASE_URL: ${{ inputs.release-url }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        TARGETS: ${{ inputs.targets }}
        OVERRIDE_YAML: ${{ inputs.override-yaml }}
      run: |
        set -euo pipefail
        override_file="$(mktemp)"
        plan_file="$(mktemp)"
        matrix_file="$(mktemp)"
        printf '%s' "$OVERRIDE_YAML" > "$override_file"

        blockops-resolve-distribution-plan \
          --release-tag "$RELEASE_TAG" \
          --release-name "$RELEASE_NAME" \
          --release-body "$RELEASE_BODY" \
          --release-url "$RELEASE_URL" \
          --manifest-path "$MANIFEST_PATH" \
          --targets "$TARGETS" \
          --override-yaml-file "$override_file" \
          --plan-file "$plan_file" \
          --matrix-file "$matrix_file"

        delimiter="blockops-$(openssl rand -hex 16)"
        {
          echo "plan-json<<$delimiter"
          cat "$plan_file"
          echo
          echo "$delimiter"
          echo "matrix-json<<$delimiter"
          cat "$matrix_file"
          echo
          echo "$delimiter"
        } >> "$GITHUB_OUTPUT"
